<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>英検ライティング道場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #6C63FF;
  --primary-dark: #5A52D5;
  --secondary: #FF6584;
  --accent: #43E97B;
  --accent2: #38F9D7;
  --bg: #F0F0FF;
  --card: #FFFFFF;
  --text: #2D2B55;
  --text-light: #7B7B9D;
  --shadow: 0 8px 32px rgba(108,99,255,0.15);
  --shadow-sm: 0 4px 12px rgba(108,99,255,0.1);
  --radius: 20px;
  --radius-sm: 12px;
  --gold: #FFD700;
  --star-empty: #E0E0E0;
  --grade3: #43E97B;
  --grade-pre2: #6C63FF;
  --grade2: #FF6584;
  --email-bg: #FFF8E1;
  --essay-bg: #E8F5E9;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Sans JP', 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
}

.screen { display: none; min-height: 100vh; min-height: 100dvh; }
.screen.active { display: flex; flex-direction: column; }

/* ===== HOME SCREEN ===== */
.home-screen {
  background: linear-gradient(135deg, #6C63FF 0%, #a18cd1 50%, #fbc2eb 100%);
  align-items: center;
  justify-content: center;
  padding: 24px;
  gap: 20px;
}

.home-logo {
  font-size: 3rem;
  text-align: center;
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.home-title {
  font-size: 2rem;
  font-weight: 900;
  color: #fff;
  text-align: center;
  text-shadow: 2px 2px 8px rgba(0,0,0,0.2);
  line-height: 1.3;
}

.home-subtitle {
  color: rgba(255,255,255,0.9);
  font-size: 1rem;
  text-align: center;
}

.home-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 28px 24px;
  width: 100%;
  max-width: 400px;
  box-shadow: var(--shadow);
}

.selector-group {
  margin-bottom: 20px;
}

.selector-label {
  font-weight: 700;
  font-size: 0.9rem;
  margin-bottom: 10px;
  color: var(--text-light);
}

.selector-buttons {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.sel-btn {
  flex: 1;
  min-width: 80px;
  padding: 12px 8px;
  border: 2px solid #E0E0F0;
  border-radius: var(--radius-sm);
  background: #FAFAFF;
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--text);
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
}

.sel-btn:hover { border-color: var(--primary); background: #F0F0FF; }
.sel-btn.selected {
  border-color: var(--primary);
  background: var(--primary);
  color: #fff;
  transform: scale(1.05);
}

.sel-btn.disabled {
  opacity: 0.4;
  pointer-events: none;
}

.start-btn {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: #fff;
  font-family: inherit;
  font-size: 1.2rem;
  font-weight: 900;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 4px 16px rgba(108,99,255,0.3);
}

.start-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(108,99,255,0.4); }
.start-btn:active { transform: translateY(0); }

.stats-row {
  display: flex;
  gap: 12px;
  width: 100%;
  max-width: 400px;
}

.stat-card {
  flex: 1;
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(10px);
  border-radius: var(--radius-sm);
  padding: 14px 12px;
  text-align: center;
  color: #fff;
}

.stat-num { font-size: 1.6rem; font-weight: 900; font-family: 'Nunito', sans-serif; }
.stat-label { font-size: 0.75rem; opacity: 0.9; }

/* ===== PRACTICE SCREEN ===== */
.practice-screen {
  background: var(--bg);
}

.practice-header {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  padding: 10px 16px 6px;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  color: #fff;
  position: sticky;
  top: 0;
  z-index: 10;
}

.practice-header .progress-bar-bg {
  width: 100%;
  order: 10;
}

.back-btn {
  background: rgba(255,255,255,0.2);
  border: none;
  border-radius: 50%;
  width: 36px;
  height: 36px;
  color: #fff;
  font-size: 1.2rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.practice-title { font-weight: 700; font-size: 1rem; flex: 1; }

.timer-badge {
  background: rgba(255,255,255,0.2);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 0.85rem;
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  cursor: pointer;
}

.practice-body {
  flex: 1;
  padding: 16px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 0;
}

/* ── 左右分割レイアウト ── */
.practice-split {
  flex: 1;
  display: flex;
  gap: 16px;
  overflow: hidden;
  min-height: 0;
}

.practice-left {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding-bottom: 16px;
  min-width: 0;
}

.practice-right {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
}

.practice-right .writing-area {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.practice-right .writing-textarea {
  flex: 1;
  min-height: 120px;
}

/* モバイル: 縦積み、問題文は折りたたみ可能 */
@media (max-width: 768px) {
  .practice-split {
    flex-direction: column;
    overflow-y: auto;
  }
  .practice-left {
    overflow: visible;
    flex: none;
  }
  .practice-right {
    flex: none;
    padding-bottom: 100px;
  }
  .practice-right .writing-textarea {
    min-height: 180px;
  }
  .prompt-toggle {
    display: flex;
  }
  .prompt-card.collapsed .email-body,
  .prompt-card.collapsed .essay-topic,
  .prompt-card.collapsed .essay-topic-label,
  .prompt-card.collapsed [style*="tips"] {
    display: none;
  }
  .prompt-card.collapsed {
    padding: 12px 16px;
  }
}

.prompt-toggle {
  display: none;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--primary);
  padding-top: 8px;
}

.prompt-toggle .toggle-icon {
  transition: transform 0.2s;
}

.prompt-card.collapsed .prompt-toggle .toggle-icon {
  transform: rotate(-90deg);
}

/* Email/Topic Card */
.prompt-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow-sm);
  position: relative;
  overflow: hidden;
}

.prompt-card.email-mode {
  border-left: 5px solid #FFC107;
}

.prompt-card.essay-mode {
  border-left: 5px solid var(--accent);
}

.email-header {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 12px;
  padding-bottom: 12px;
  border-bottom: 1px solid #F0F0F0;
}

.email-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, #FFC107, #FF9800);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  color: #fff;
  font-weight: 700;
}

.email-meta { flex: 1; }
.email-from { font-weight: 700; font-size: 0.95rem; }
.email-subject { font-size: 0.8rem; color: var(--text-light); }

.email-body {
  font-size: 0.95rem;
  line-height: 1.8;
  white-space: pre-line;
}

.email-body .question-highlight {
  background: linear-gradient(transparent 60%, #FFE082 60%);
  font-weight: 700;
}

.essay-topic-label {
  font-size: 0.8rem;
  color: var(--text-light);
  font-weight: 700;
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.essay-topic-text {
  font-size: 1.1rem;
  font-weight: 700;
  line-height: 1.6;
  font-family: 'Nunito', 'Noto Sans JP', sans-serif;
}

/* Structure Guide */
.structure-card {
  background: linear-gradient(135deg, #E8F5E9, #C8E6C9);
  border-radius: var(--radius);
  padding: 16px;
}

.structure-title {
  font-weight: 700;
  font-size: 0.85rem;
  color: #2E7D32;
  margin-bottom: 8px;
}

.structure-steps {
  list-style: none;
  font-size: 0.85rem;
  line-height: 1.8;
}

.structure-steps li {
  padding-left: 24px;
  position: relative;
}

.structure-steps li::before {
  content: attr(data-num);
  position: absolute;
  left: 0;
  width: 18px;
  height: 18px;
  background: #43A047;
  color: #fff;
  border-radius: 50%;
  font-size: 0.7rem;
  display: flex;
  align-items: center;
  justify-content: center;
  top: 4px;
  font-weight: 700;
}

/* Writing Area */
.writing-area {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow-sm);
}

.writing-label {
  font-weight: 700;
  font-size: 0.9rem;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.writing-textarea {
  width: 100%;
  min-height: 180px;
  border: 2px solid #E0E0F0;
  border-radius: var(--radius-sm);
  padding: 14px;
  font-family: 'Nunito', 'Noto Sans JP', sans-serif;
  font-size: 1rem;
  line-height: 1.8;
  resize: vertical;
  outline: none;
  transition: border-color 0.2s;
}

.writing-textarea:focus {
  border-color: var(--primary);
}

.word-counter {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 10px;
  font-size: 0.85rem;
}

.word-count {
  font-weight: 700;
  font-family: 'Nunito', sans-serif;
  font-size: 1.1rem;
}

.word-count.under { color: var(--secondary); }
.word-count.good { color: var(--accent); }
.word-count.over { color: #FF9800; }

.word-target {
  color: var(--text-light);
  font-size: 0.8rem;
}

/* Submit Button */
.submit-area {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 16px;
  background: linear-gradient(transparent, var(--bg) 20%);
  z-index: 10;
}

.submit-btn {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: var(--text);
  font-family: inherit;
  font-size: 1.2rem;
  font-weight: 900;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 4px 16px rgba(67,233,123,0.3);
}

.submit-btn:hover { transform: translateY(-2px); }
.submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* ===== REVIEW SCREEN ===== */
.review-screen {
  background: var(--bg);
}

.review-header {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  padding: 24px 20px;
  text-align: center;
  color: var(--text);
}

.review-stars {
  font-size: 2.5rem;
  margin-bottom: 8px;
  animation: popIn 0.5s ease;
}

@keyframes popIn {
  0% { transform: scale(0); opacity: 0; }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); opacity: 1; }
}

.review-msg {
  font-weight: 900;
  font-size: 1.3rem;
}

.review-body {
  flex: 1;
  padding: 16px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding-bottom: 100px;
}

.review-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow-sm);
}

.review-card-title {
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--text-light);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.review-answer {
  font-size: 0.95rem;
  line-height: 1.8;
  white-space: pre-wrap;
  word-break: break-word;
}

.model-answer-box {
  background: #F0FFF4;
  border: 2px solid #C8E6C9;
  border-radius: var(--radius-sm);
  padding: 14px;
  font-size: 0.95rem;
  line-height: 1.8;
  white-space: pre-wrap;
}

/* Self Check */
.self-check-list {
  list-style: none;
}

.self-check-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid #F0F0F0;
  font-size: 0.9rem;
  cursor: pointer;
  user-select: none;
}

.self-check-item:last-child { border-bottom: none; }

.check-box {
  width: 28px;
  height: 28px;
  border: 2px solid #E0E0F0;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  transition: all 0.2s;
  flex-shrink: 0;
}

.self-check-item.checked .check-box {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

/* Next Button */
.next-area {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 16px;
  background: linear-gradient(transparent, var(--bg) 20%);
  z-index: 10;
  display: flex;
  gap: 10px;
}

.next-btn {
  flex: 1;
  padding: 16px;
  border: none;
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: #fff;
  font-family: inherit;
  font-size: 1.1rem;
  font-weight: 900;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 4px 16px rgba(108,99,255,0.3);
}

.home-return-btn {
  padding: 16px 20px;
  border: 2px solid var(--primary);
  border-radius: var(--radius-sm);
  background: #fff;
  color: var(--primary);
  font-family: inherit;
  font-size: 1.1rem;
  font-weight: 900;
  cursor: pointer;
  transition: all 0.2s;
}

/* ===== Score Circle ===== */
.score-circle-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 16px;
}

.score-circle {
  position: relative;
  width: 120px;
  height: 120px;
}

.score-circle svg {
  transform: rotate(-90deg);
  width: 120px;
  height: 120px;
}

.score-circle .bg-ring {
  fill: none;
  stroke: #E0E0F0;
  stroke-width: 10;
}

.score-circle .fg-ring {
  fill: none;
  stroke-width: 10;
  stroke-linecap: round;
  transition: stroke-dashoffset 1s ease, stroke 0.3s;
}

.score-number {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 2rem;
  font-weight: 900;
  font-family: 'Nunito', sans-serif;
}

.score-label {
  font-size: 0.85rem;
  color: var(--text-light);
  margin-top: 4px;
  font-weight: 700;
}

/* ===== Feedback Items ===== */
.feedback-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.feedback-item {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
  line-height: 1.5;
}

.feedback-item.error {
  background: #FFF0F0;
  border: 1px solid #FFCDD2;
}

.feedback-item.warning {
  background: #FFFDE7;
  border: 1px solid #FFF9C4;
}

.feedback-item.good {
  background: #F0FFF4;
  border: 1px solid #C8E6C9;
}

.feedback-icon {
  font-size: 1.1rem;
  flex-shrink: 0;
  margin-top: 1px;
}

.feedback-text {
  flex: 1;
}

.feedback-fix {
  display: block;
  margin-top: 4px;
  font-size: 0.8rem;
  color: var(--text-light);
  font-style: italic;
}

.review-answer mark {
  background: #FFCDD2;
  padding: 1px 3px;
  border-radius: 3px;
}

/* Responsive */
@media (min-width: 768px) {
  .practice-body, .review-body {
    max-width: 640px;
    margin: 0 auto;
    width: 100%;
  }
  .submit-area, .next-area {
    max-width: 640px;
    left: 50%;
    transform: translateX(-50%);
  }
}

/* Animations */
.fade-in {
  animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.slide-up {
  animation: slideUp 0.3s ease;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(40px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Toast */
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(-100px);
  background: var(--text);
  color: #fff;
  padding: 12px 24px;
  border-radius: 30px;
  font-size: 0.9rem;
  font-weight: 700;
  z-index: 100;
  transition: transform 0.3s ease;
  white-space: nowrap;
}

.toast.show {
  transform: translateX(-50%) translateY(0);
}

/* Progress bar */
.progress-bar-bg {
  height: 4px;
  background: rgba(255,255,255,0.2);
  width: 100%;
}

.progress-bar-fill {
  height: 100%;
  background: rgba(255,255,255,0.8);
  transition: width 0.3s ease;
  border-radius: 2px;
}
</style>
</head>
<body>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- ===== HOME SCREEN ===== -->
<div class="screen home-screen active" id="homeScreen">
  <div class="home-logo">&#x270D;&#xFE0F;</div>
  <h1 class="home-title">英検<br>ライティング道場</h1>
  <p class="home-subtitle">Eメール返信 & 意見文 練習</p>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-num" id="statTotal">0</div>
      <div class="stat-label">練習回数</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statStars">0</div>
      <div class="stat-label">獲得スター</div>
    </div>
  </div>

  <div class="home-card">
    <div class="selector-group">
      <div class="selector-label">級を選ぼう</div>
      <div class="selector-buttons" id="gradeSelector">
        <button class="sel-btn" data-grade="3">3級</button>
        <button class="sel-btn" data-grade="pre2">準2級</button>
        <button class="sel-btn" data-grade="2">2級</button>
      </div>
    </div>

    <div class="selector-group">
      <div class="selector-label">モードを選ぼう</div>
      <div class="selector-buttons" id="modeSelector">
        <button class="sel-btn" data-mode="email">Eメール<br>返信</button>
        <button class="sel-btn" data-mode="essay">意見文</button>
      </div>
    </div>

    <button class="start-btn" id="startBtn" disabled>始める!</button>
    <a href="https://wise-english-portal.vercel.app" style="display:inline-block;margin-top:12px;color:rgba(255,255,255,0.8);font-weight:700;font-size:0.9rem;text-decoration:none;">🏠 学習ポータルに戻る</a>
  </div>
</div>

<!-- ===== PRACTICE SCREEN ===== -->
<div class="screen practice-screen" id="practiceScreen">
  <div class="practice-header">
    <button class="back-btn" id="backBtn">&#x2190;</button>
    <span class="practice-title" id="practiceTitle">3級 Eメール返信</span>
    <span class="timer-badge" id="timerBadge" title="タイマー ON/OFF">00:00</span>
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar" style="width:0%"></div></div>
  </div>
  <div class="practice-body" id="practiceBody">
    <div class="practice-split">
      <div class="practice-left">
        <!-- Prompt card inserted by JS -->
        <div id="promptArea"></div>
        <!-- Structure guide -->
        <div class="structure-card fade-in" id="structureCard"></div>
      </div>
      <div class="practice-right">
        <!-- Writing area -->
        <div class="writing-area fade-in">
          <div class="writing-label">&#x1F4DD; あなたの解答</div>
          <textarea class="writing-textarea" id="writingInput" placeholder="ここに英語で書こう..."></textarea>
          <div class="word-counter">
            <span><span class="word-count" id="wordCount">0</span> words</span>

  "2_email": [
    { from: "Michael", subject: "Studying abroad", body: "Hi! It's been a while since I last wrote to you. I've been thinking a lot about my future recently. My school organized a career fair last month, and I had the chance to talk to people working in different fields. It was really eye-opening.\n\nOne thing that surprised me was how many people said that international experience had been crucial to their careers. A marketing manager I spoke with said that studying abroad completely changed her perspective on business. Now I'm seriously considering studying in another country next year to improve my English and broaden my horizons.\n\n<q>What do you think are the biggest challenges of studying abroad?</q> Also, <q>how do you think studying abroad can help someone's career in the future?</q>\n\nI'm really curious about your perspective on this.\n\nBest regards,\nMichael", modelReply: "Hi Michael,\n\nThank you for your email. Studying abroad is a wonderful idea.\n\nI think the biggest challenges of studying abroad are adjusting to a new culture and being away from family and friends. At first, everything feels unfamiliar, from the food to social customs. Language barriers can also make daily life stressful, even if you have studied the language before.\n\nAs for career benefits, I believe studying abroad can help greatly. Employers value people who have international experience because it shows adaptability and communication skills. You also build a global network of contacts that may open doors to opportunities in the future.\n\nI hope you decide to go!\n\nYour friend", tips: "留学の最大の課題と、将来のキャリアにどう役立つかを詳しく書こう" },
    { from: "Sarah", subject: "Social media and news", body: "Hi! How are you doing? I hope things are going well. I read a really interesting article the other day about how young people get their news from social media instead of traditional sources like newspapers or TV. According to the article, more than 70% of teenagers say they rely on social media for daily news.\n\nThis made me think about my own habits. I have to admit that I mostly scroll through my social media feed to find out what's happening in the world. My parents say that's not a good idea because a lot of the information might not be accurate. I'm starting to wonder if they have a point.\n\n<q>Do you think social media is a reliable source of news?</q> Also, <q>what are the advantages and disadvantages of getting news from social media?</q>\n\nI'd really value your thoughts on this.\n\nBest regards,\nSarah", modelReply: "Hi Sarah,\n\nThank you for your email. This is a very important topic.\n\nI don't think social media is always a reliable source of news. Anyone can post information online, and it is often difficult to tell the difference between facts and opinions. Misinformation can spread quickly, and people may believe false stories without checking them.\n\nThe main advantage of getting news from social media is speed and convenience. You can see breaking news instantly and read about topics you are interested in. However, the disadvantage is that algorithms show you content that matches your existing views, creating a \"filter bubble.\" This means you may not see different perspectives on important issues.\n\nBest regards", tips: "SNSでのニュースの信頼性と、メリット・デメリットを詳しく書こう" },
    { from: "David", subject: "Environmental actions", body: "Hi! I hope you're doing well. I have some exciting news — our school is starting a new environmental project this semester. The principal announced that we want to become a \"green school\" by reducing waste and saving energy. A group of students, including me, have been chosen to lead the project.\n\nWe've already started by placing recycling bins in every classroom, but I think we need to do much more. I've been researching what other schools around the world are doing, and some of the ideas are really inspiring. I'd love to get your perspective.\n\n<q>What actions do you think schools should take to protect the environment?</q> Also, <q>do you think individual actions can really make a difference in solving environmental problems?</q>\n\nYour input would be very helpful.\n\nBest regards,\nDavid", modelReply: "Hi David,\n\nThank you for your email. It's great that your school is taking action.\n\nI think schools should take several steps to protect the environment. First, they should ban single-use plastics in the cafeteria and encourage students to bring reusable bottles and containers. Schools could also install solar panels and LED lights to save energy. Environmental education programs would help students understand why these changes matter.\n\nAs for whether individual actions make a difference, I believe they absolutely can. When one person starts recycling or using public transportation, it inspires others to do the same. Small actions, multiplied by millions of people, create significant change. The key is that individual actions and government policies need to work together.\n\nGood luck with your project!\n\nYour friend", tips: "学校が取るべき環境対策と、個人の行動が環境問題に効果があるかを詳しく書こう" },
    { from: "Emma", subject: "AI in education", body: "Hi! How have you been? I wanted to share something interesting that happened at school this week. Our teacher introduced us to an AI tutoring program that can answer questions and explain difficult concepts. Some students were really excited about it, but others seemed worried that AI might replace teachers someday.\n\nOur teacher also mentioned that some schools in other countries have already started using AI to grade essays and create personalized study plans for each student. It sounds impressive, but I'm not sure how I feel about it. The whole thing made me curious about what you think.\n\n<q>What do you think are the benefits of using AI in education?</q> Also, <q>are there any risks or problems that you think AI might cause in schools?</q>\n\nI look forward to hearing your thoughts.\n\nBest regards,\nEmma", modelReply: "Hi Emma,\n\nThank you for your email. AI in education is a fascinating topic.\n\nI think AI has many benefits in education. It can provide personalized learning experiences for each student. For example, AI programs can identify areas where a student is struggling and offer extra practice on those topics. AI can also help teachers by grading simple assignments automatically, giving them more time to focus on creative teaching.\n\nHowever, there are some risks. Students might become too dependent on AI and lose the ability to think critically on their own. There are also concerns about privacy, as AI systems collect a lot of personal data. Additionally, if students use AI to write essays or solve problems for them, they will not actually learn the material.\n\nBest regards", tips: "AIを教育に使うメリットと、学校でAIが引き起こしうるリスクや問題を詳しく書こう" },
    { from: "Tom", subject: "Work-life balance", body: "Hi! It's good to hear from you. I just finished reading an article about working culture in Japan, and it really surprised me. The article said that many Japanese workers spend more than ten hours a day at the office, and some even work on weekends. My parents sometimes come home late, too, and I can see how tired they are.\n\nIt made me think about whether working such long hours is really worth it. I believe people need time to rest, spend time with their families, and enjoy their hobbies. Otherwise, what's the point of earning money if you can't enjoy it?\n\n<q>Why do you think so many people work overtime?</q> Also, <q>what do you think companies should do to improve work-life balance?</q>\n\nI'd appreciate your thoughts on this.\n\nBest regards,\nTom", modelReply: "Hi Tom,\n\nThank you for your email. Work-life balance is a serious issue.\n\nI think many people work overtime for several reasons. In some companies, there is pressure from managers and colleagues to stay late. People worry that leaving on time will make them look lazy. Also, some workers have too many tasks and simply cannot finish everything during normal hours.\n\nTo improve work-life balance, companies should set clear rules about overtime and encourage employees to leave on time. Flexible working hours and the option to work from home would also help. Most importantly, companies should evaluate employees based on the quality of their work, not the number of hours they spend in the office.\n\nI hope things get better!\n\nYour friend", tips: "残業が多い理由と、企業がワークライフバランスを改善するためにすべきことを詳しく書こう" },
    { from: "Kate", subject: "Traveling alone", body: "Hi! I hope everything is going well. I've been planning something exciting — I want to travel abroad by myself for the first time this summer! I'm thinking of visiting a European country, maybe Spain or Italy. I've always dreamed of exploring a foreign city at my own pace, trying local food, and meeting new people.\n\nHowever, my parents are a little worried because I've never traveled alone before. They think something might go wrong, and they want me to go with a friend instead. I understand their concern, but I feel like solo travel would be a valuable experience.\n\n<q>What do you think are the benefits of traveling alone?</q> Also, <q>what advice would you give to someone who is traveling alone for the first time?</q>\n\nI'd really appreciate your input.\n\nBest regards,\nKate", modelReply: "Hi Kate,\n\nThank you for your email. Solo travel is a wonderful experience.\n\nThere are many benefits of traveling alone. You have complete freedom to decide where to go and what to do. You can change your plans anytime without worrying about other people. Solo travel also helps you become more independent and confident. You learn to solve problems and communicate with strangers.\n\nMy advice for a first-time solo traveler is to research your destination well before you go. Always share your itinerary with family so they know where you are. Keep copies of important documents like your passport. And don't be afraid to talk to other travelers — you might make wonderful friends.\n\nHave a great trip!\n\nYour friend", tips: "一人旅のメリットと、初めて一人で旅行する人へのアドバイスを詳しく書こう" },
    { from: "James", subject: "Cashless society", body: "Hi! How are things going? I noticed something interesting the other day. More and more stores near my house are going cashless, and some of them don't even accept coins or bills anymore. I hardly ever use cash myself — I pay for almost everything with my phone or credit card. It's so convenient that I sometimes forget to carry my wallet.\n\nBut last week, my grandmother couldn't pay at a cafe because they only accepted digital payments. She was really frustrated, and it made me realize that not everyone is comfortable with this change.\n\n<q>What do you think are the advantages of a cashless society?</q> Also, <q>do you think there are any problems with completely eliminating cash?</q>\n\nI'd love to hear your opinion.\n\nBest regards,\nJames", modelReply: "Hi James,\n\nThank you for your email. The shift to cashless is indeed happening fast.\n\nCashless payments have several advantages. They are faster and more convenient — you just tap your phone or card. They also reduce the risk of theft since you don't carry large amounts of money. For businesses, digital payments make accounting easier and reduce the cost of handling cash.\n\nHowever, completely eliminating cash would create problems. Elderly people who are not comfortable with technology might have difficulty making payments. System failures or power outages could make it impossible to buy anything. There are also privacy concerns, as every transaction leaves a digital record that can be tracked.\n\nBest regards", tips: "キャッシュレス社会のメリットと、現金を完全になくすことの問題点を詳しく書こう" },
    { from: "Lisa", subject: "Online vs. in-person shopping", body: "Hi! I hope you've been well. I just realized something surprising — I bought almost everything online this year. From clothes and books to groceries and birthday presents, I barely went to any actual stores. It's just so easy to compare prices, read reviews, and have things delivered to my door.\n\nBut my mother says she still prefers going to real stores. She enjoys walking around, touching the products, and talking to the shop staff. She thinks online shopping is making people too lazy. We had a funny debate about it at dinner last night.\n\n<q>Which do you prefer, online shopping or going to actual stores, and why?</q> Also, <q>how do you think online shopping has changed the way we live?</q>\n\nI'm curious about your perspective.\n\nBest regards,\nLisa", modelReply: "Hi Lisa,\n\nThank you for your email. This is a great topic to think about.\n\nI prefer online shopping because it saves a lot of time. I can compare prices from different stores easily and read reviews from other customers before buying. It is also convenient because things are delivered right to my door. However, I do go to actual stores sometimes, especially for clothes, because I want to try things on before buying.\n\nOnline shopping has changed our lives in many ways. People no longer need to travel to stores, which saves time and reduces traffic. However, many small local shops have closed because they cannot compete with large online retailers. Also, the increase in delivery trucks has created environmental concerns.\n\nBest regards", tips: "オンラインと実店舗のどちらが好きかとその理由、オンラインショッピングが生活を変えた方法を詳しく書こう" },
    { from: "Ben", subject: "Learning from mistakes", body: "Hi! I hope you're doing well. I have to be honest — I'm feeling a bit down right now. I failed a big math test last week, even though I studied really hard for it. I was so disappointed in myself that I didn't want to go to school the next day.\n\nWhen I talked to my teacher about it, she said something that stuck with me. She told me that failure is often a better teacher than success, because it forces us to reflect on what went wrong and try harder next time. I'm starting to think she might be right, but I'm not completely sure.\n\n<q>Do you agree that we can learn more from failure than from success?</q> Also, <q>can you share an experience where you learned something important from a mistake?</q>\n\nYour words would really cheer me up.\n\nBest regards,\nBen", modelReply: "Hi Ben,\n\nThank you for your email. I'm sorry about your test, but don't worry too much.\n\nI agree that we can learn more from failure than from success. When we succeed, we often don't think about why things went well. But when we fail, we are forced to analyze what went wrong and find ways to improve. Failure teaches us perseverance and helps us develop better strategies.\n\nI once forgot to prepare for an important English presentation. I was very nervous and did a poor job. After that experience, I learned to always start preparing early and practice several times before presenting. Now I am much more organized, and my presentations have improved greatly. That failure taught me a valuable lesson about preparation.\n\nDon't give up!\n\nYour friend", tips: "失敗から成功より多くを学べるかどうかと、失敗から学んだ経験を詳しく書こう" },
    { from: "Amy", subject: "Traditions and modern life", body: "Hi! It's been a while since we last talked. I had an interesting conversation with my grandmother over the weekend. She told me that when she was young, her whole family would gather to celebrate traditional festivals, prepare special food together, and wear traditional clothes. She seemed sad when she said that young people today don't care about those customs anymore.\n\nIt made me think about how much our lives have changed. With globalization and technology, we're exposed to so many different cultures that local traditions sometimes get forgotten. I personally think it's important to keep some traditions alive, but I understand why they're fading.\n\n<q>Why do you think some traditions are disappearing?</q> Also, <q>which traditions do you think are important to keep, and why?</q>\n\nI'd love to hear your thoughts on this.\n\nBest regards,\nAmy", modelReply: "Hi Amy,\n\nThank you for your email. This is a very interesting topic.\n\nI think traditions are disappearing for several reasons. Modern life is very busy, and people don't have time for traditional activities. Technology and globalization have also introduced new customs and entertainment that replace old ones. Young people are more influenced by international culture through the internet and social media.\n\nHowever, I think some traditions are very important to keep. For example, New Year's celebrations and local festivals bring communities together and help us remember our cultural identity. Traditional crafts and arts, like calligraphy and pottery, should also be preserved because they represent generations of skill and creativity. We can enjoy modern life while still respecting and practicing our traditions.\n\nBest regards", tips: "伝統が消えつつある理由と、守るべき伝統とその理由を詳しく書こう" }

// ===== AUDIO =====
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function ensureAudioCtx() {
  if (!audioCtx) audioCtx = new AudioCtx();
}

function playSound(type) {
  try {
    ensureAudioCtx();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'select') {
      osc.frequency.value = 600;
      gain.gain.value = 0.1;
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    } else if (type === 'submit') {
      osc.frequency.value = 523;
      gain.gain.value = 0.15;
      osc.start();
      osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.1);
      osc.frequency.setValueAtTime(784, audioCtx.currentTime + 0.2);
      osc.stop(audioCtx.currentTime + 0.35);
    } else if (type === 'star') {
      osc.frequency.value = 880;
      osc.type = 'triangle';
      gain.gain.value = 0.12;
      osc.start();
      osc.frequency.setValueAtTime(1100, audioCtx.currentTime + 0.1);
      osc.stop(audioCtx.currentTime + 0.2);
    } else if (type === 'click') {
      osc.frequency.value = 400;
      gain.gain.value = 0.05;
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }
  } catch (e) {}
}

// ===== LOCAL STORAGE =====
function loadStats() {
  try {
    const saved = localStorage.getItem('eiken_writing_stats');
    if (saved) state.stats = JSON.parse(saved);
  } catch (e) {}
  updateStatsDisplay();
}

function saveStats() {
  try {
    localStorage.setItem('eiken_writing_stats', JSON.stringify(state.stats));
  } catch (e) {}
  updateStatsDisplay();
}

function updateStatsDisplay() {
  document.getElementById('statTotal').textContent = state.stats.total;
  document.getElementById('statStars').textContent = state.stats.stars;
}

// ===== TOAST =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ===== SCREEN NAVIGATION =====
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

// ===== HOME SCREEN LOGIC =====
const gradeSelector = document.getElementById('gradeSelector');
const modeSelector = document.getElementById('modeSelector');
const startBtn = document.getElementById('startBtn');

gradeSelector.addEventListener('click', e => {
  const btn = e.target.closest('.sel-btn');
  if (!btn) return;
  playSound('select');
  gradeSelector.querySelectorAll('.sel-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  state.grade = btn.dataset.grade;
  updateModeAvailability();
  updateStartBtn();
});

modeSelector.addEventListener('click', e => {
  const btn = e.target.closest('.sel-btn');
  if (!btn || btn.classList.contains('disabled')) return;
  playSound('select');
  modeSelector.querySelectorAll('.sel-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  state.mode = btn.dataset.mode;
  updateStartBtn();
});

function updateModeAvailability() {
  // 全級で両方のモードを選べる
  modeSelector.querySelectorAll('.sel-btn').forEach(b => {
    b.classList.remove('disabled', 'selected');
    b.title = '';
  });
  // デフォルトでEメール返信を選択
  const emailBtn = modeSelector.querySelector('[data-mode="email"]');
  emailBtn.classList.add('selected');
  state.mode = 'email';
}

function updateStartBtn() {
  startBtn.disabled = !(state.grade && state.mode);
}

startBtn.addEventListener('click', () => {
  if (!state.grade || !state.mode) return;
  playSound('submit');
  state.usedIndices = [];
  startPractice();
});

// ===== PRACTICE LOGIC =====
function getQuestionKey() {
  return state.grade + '_' + state.mode;
}

function getNextQuestion() {
  const key = getQuestionKey();
  const questions = QUESTIONS[key];
  const available = [];
  for (let i = 0; i < questions.length; i++) {
    if (!state.usedIndices.includes(i)) available.push(i);
  }
  if (available.length === 0) {
    state.usedIndices = [];
    for (let i = 0; i < questions.length; i++) available.push(i);
  }
  const idx = available[Math.floor(Math.random() * available.length)];
  state.usedIndices.push(idx);
  state.currentIndex = idx;
  return questions[idx];
}

function startPractice() {
  const q = getNextQuestion();
  const key = getQuestionKey();
  const questions = QUESTIONS[key];

  // Update header
  const gradeLabel = state.grade === '3' ? '3級' : state.grade === 'pre2' ? '準2級' : '2級';
  const modeLabel = state.mode === 'email' ? 'Eメール返信' : '意見文';
  document.getElementById('practiceTitle').textContent = `${gradeLabel} ${modeLabel}`;

  // Progress
  const progress = (state.usedIndices.length / questions.length) * 100;
  document.getElementById('progressBar').style.width = progress + '%';

  // Render prompt
  const promptArea = document.getElementById('promptArea');
  if (state.mode === 'email') {
    promptArea.innerHTML = renderEmailPrompt(q);
  } else {
    promptArea.innerHTML = renderEssayPrompt(q);
  }

  // Render structure guide
  renderStructureGuide();

  // Word target
  const target = WORD_TARGETS[state.grade];
  document.getElementById('wordTarget').textContent = `目標: ${target.label}語`;

  // Reset textarea
  const textarea = document.getElementById('writingInput');
  textarea.value = '';
  document.getElementById('wordCount').textContent = '0';
  document.getElementById('wordCount').className = 'word-count under';
  document.getElementById('submitBtn').disabled = true;

  // Reset timer
  clearInterval(state.timerInterval);
  state.timerSeconds = 0;
  state.timerRunning = true;
  document.getElementById('timerBadge').textContent = '00:00';
  state.timerInterval = setInterval(updateTimer, 1000);

  showScreen('practiceScreen');
}

function renderEmailPrompt(q) {
  const bodyHtml = q.body.replace(/<q>/g, '<span class="question-highlight">').replace(/<\/q>/g, '</span>');
  return `
    <div class="prompt-card email-mode fade-in" id="promptCard">
      <div class="email-header">
        <div class="email-avatar">${q.from[0]}</div>
        <div class="email-meta">
          <div class="email-from">From: ${q.from}</div>
          <div class="email-subject">Subject: ${q.subject}</div>
        </div>
      </div>
      <div class="email-body">${bodyHtml}</div>
      <div class="prompt-toggle" onclick="document.getElementById('promptCard').classList.toggle('collapsed')">
        <span>問題文を表示/非表示</span>
        <span class="toggle-icon">▼</span>
      </div>
    </div>
  `;
}

function renderEssayPrompt(q) {
  return `
    <div class="prompt-card essay-mode fade-in" id="promptCard">
      <div class="essay-topic-label">TOPIC</div>
      <div class="essay-topic">${q.topic}</div>
      <div style="margin-top:10px;font-size:0.8rem;color:var(--text-light)">&#x1F4A1; ${q.tips}</div>
      <div class="prompt-toggle" onclick="document.getElementById('promptCard').classList.toggle('collapsed')">
        <span>問題文を表示/非表示</span>
        <span class="toggle-icon">▼</span>
      </div>
    </div>
  `;
}

function renderStructureGuide() {
  const card = document.getElementById('structureCard');
  if (state.mode === 'email') {
    card.innerHTML = `
      <div class="structure-title">&#x1F4DD; 書き方ガイド</div>
      <ol class="structure-steps">
        <li data-num="1">Hi [名前], で書き始める</li>
        <li data-num="2">Thank you for your email. を書く</li>
        <li data-num="3">1つ目の質問に答える</li>
        <li data-num="4">2つ目の質問に答える</li>
        <li data-num="5">Your friend, で終わる</li>
      </ol>
    `;
  } else {
    card.innerHTML = `
      <div class="structure-title">&#x1F4DD; 書き方ガイド</div>
      <ol class="structure-steps">
        <li data-num="1">I think ... (自分の意見)</li>
        <li data-num="2">First, ... (理由1)</li>
        <li data-num="3">Second, ... (理由2)</li>
        ${state.grade === '2' ? '<li data-num="4">詳しい説明や例を足す</li>' : ''}
      </ol>
    `;
  }
}

// Timer
function updateTimer() {
  if (!state.timerRunning) return;
  state.timerSeconds++;
  const m = String(Math.floor(state.timerSeconds / 60)).padStart(2, '0');
  const s = String(state.timerSeconds % 60).padStart(2, '0');
  document.getElementById('timerBadge').textContent = `${m}:${s}`;
}

document.getElementById('timerBadge').addEventListener('click', () => {
  state.timerRunning = !state.timerRunning;
  if (!state.timerRunning) {
    showToast('タイマー停止');
  } else {
    showToast('タイマー再開');
  }
});

// Word counter
document.getElementById('writingInput').addEventListener('input', () => {
  const text = document.getElementById('writingInput').value.trim();
  const words = text ? text.split(/\s+/).filter(w => w.length > 0).length : 0;
  const countEl = document.getElementById('wordCount');
  countEl.textContent = words;

  const target = WORD_TARGETS[state.grade];
  if (words < target.min) {
    countEl.className = 'word-count under';
  } else if (words > target.max) {
    countEl.className = 'word-count over';
  } else {
    countEl.className = 'word-count good';
  }

  document.getElementById('submitBtn').disabled = words < 3;
});

// Back button
document.getElementById('backBtn').addEventListener('click', () => {
  clearInterval(state.timerInterval);
  showScreen('homeScreen');
});

// Submit
document.getElementById('submitBtn').addEventListener('click', () => {
  playSound('submit');
  clearInterval(state.timerInterval);
  showReview();
});

// ===== AUTO GRADING ENGINE =====
function gradeEssay(text, question, mode) {
  const feedback = [];
  let scores = { wordCount: 0, capitalization: 0, punctuation: 0, content: 0, grammar: 0 };

  if (!text || text.trim().length === 0) {
    feedback.push({ type: 'error', message: '解答が入力されていません。' });
    return { feedback, score: 0, scores };
  }

  const sentences = text.split(/(?<=[.!?])\s+/).filter(s => s.trim().length > 0);
  const words = text.trim().split(/\s+/).filter(w => w.length > 0);
  const wordCount = words.length;
  const target = WORD_TARGETS[state.grade];
  const lowerText = text.toLowerCase();

  // ===== 1. Word Count Check (20 points) =====
  if (wordCount >= target.min && wordCount <= target.max) {
    scores.wordCount = 20;
    feedback.push({ type: 'good', message: `語数が目標範囲内です (${wordCount}語 / 目標${target.label}語)` });
  } else if (wordCount < target.min) {
    const ratio = wordCount / target.min;
    scores.wordCount = Math.round(20 * Math.min(ratio, 1));
    if (wordCount < target.min * 0.5) {
      feedback.push({ type: 'error', message: `語数が足りません (${wordCount}語 / 目標${target.label}語)。もっと詳しく書こう！` });
    } else {
      feedback.push({ type: 'warning', message: `語数がやや少なめです (${wordCount}語 / 目標${target.label}語)。あと少し書き足そう！` });
    }
  } else {
    scores.wordCount = 15; // slightly over is ok
    feedback.push({ type: 'warning', message: `語数が多めです (${wordCount}語 / 目標${target.label}語)。少しコンパクトにしよう。` });
  }

  // ===== 2. Capitalization Check (15 points) =====
  let capErrors = 0;
  let capErrorExamples = [];

  // Check first word of text
  if (text.length > 0 && text[0] !== text[0].toUpperCase() && /[a-z]/.test(text[0])) {
    capErrors++;
    const firstWord = words[0] || '';
    capErrorExamples.push(`'${firstWord}' → '${firstWord.charAt(0).toUpperCase() + firstWord.slice(1)}'`);
  }

  // Check first word after sentence-ending punctuation
  const sentenceStarts = text.matchAll(/[.!?]\s+([a-z])/g);
  for (const match of sentenceStarts) {
    capErrors++;
    if (capErrorExamples.length < 3) {
      capErrorExamples.push(`'...${match[0]}' → 文の始めを大文字に`);
    }
  }

  // Check "i" used as pronoun (standalone)
  const iErrors = text.match(/\b(?<!['])(i)\b(?!\s*['.])/g);
  if (iErrors) {
    const iAlone = text.match(/(?:^|\s)(i)(?:\s|[,.]|$)/g);
    if (iAlone) {
      capErrors += iAlone.length;
      if (capErrorExamples.length < 3) {
        capErrorExamples.push(`'i' → 'I'（主語のIは常に大文字）`);
      }
    }
  }

  if (capErrors === 0) {
    scores.capitalization = 15;
    feedback.push({ type: 'good', message: '大文字の使い方が正しいです！' });
  } else {
    scores.capitalization = Math.max(0, 15 - capErrors * 3);
    feedback.push({
      type: 'error',
      message: `文の始めを大文字にしよう`,
      fix: capErrorExamples.join('、')
    });
  }

  // ===== 3. Punctuation Check (15 points) =====
  let punctErrors = 0;
  // Split by apparent sentence boundaries
  const roughSentences = text.split(/\n+/).flatMap(line => {
    // Split on sentence-ending punctuation or detect missing ones
    return line.split(/(?<=[.!?])\s+/);
  }).filter(s => s.trim().length > 0);

  let missingPunct = 0;
  for (const s of roughSentences) {
    const trimmed = s.trim();
    if (trimmed.length > 0 && !/[.!?,]$/.test(trimmed) && trimmed.length > 10) {
      // Long segment without ending punctuation
      missingPunct++;
    }
  }

  if (missingPunct === 0) {
    scores.punctuation = 15;
    feedback.push({ type: 'good', message: '句読点（ピリオド・クエスチョンマーク）が正しく使われています！' });
  } else {
    scores.punctuation = Math.max(0, 15 - missingPunct * 4);
    feedback.push({
      type: 'error',
      message: `文末にピリオド (.) やクエスチョンマーク (?) を付けよう`,
      fix: `${missingPunct}箇所で句読点が不足しています`
    });
  }

  // ===== 4. Content Check (30 points) =====
  if (mode === 'email') {
    let contentScore = 0;

    // Check greeting
    if (/^hi\b/i.test(text.trim()) || /^dear\b/i.test(text.trim())) {
      contentScore += 6;
      feedback.push({ type: 'good', message: '挨拶（Hi/Dear）がきちんと書けています！' });
    } else {
      feedback.push({ type: 'warning', message: 'Hi [名前], で始めよう' });
    }

    // Check thank you
    if (/thank\s+you\s+(for\s+)?(your\s+)?email/i.test(text)) {
      contentScore += 6;
      feedback.push({ type: 'good', message: '"Thank you for your email." が書けています！' });
    } else {
      feedback.push({ type: 'warning', message: '"Thank you for your email." を入れよう' });
    }

    // Check closing
    if (/your\s+friend/i.test(text) || /best\s+(wishes|regards)/i.test(text) || /sincerely/i.test(text) || /see\s+you/i.test(text)) {
      contentScore += 6;
      feedback.push({ type: 'good', message: '締めの言葉が書けています！' });
    } else {
      feedback.push({ type: 'warning', message: '"Your friend," などの締めの言葉を入れよう' });
    }

    // Check question coverage (extract keywords from questions in the email body)
    const questionMatches = question.body.match(/<q>(.*?)<\/q>/g) || [];
    let answeredCount = 0;
    for (const qTag of questionMatches) {
      const qText = qTag.replace(/<\/?q>/g, '').toLowerCase();
      // Extract key nouns/verbs from the question
      const keyWords = qText.split(/\s+/).filter(w =>
        w.length > 3 && !['what','your','this','that','with','from','about','have','does','will','should','which','when','where','also','please','tell'].includes(w)
      );
      const answered = keyWords.some(kw => lowerText.includes(kw));
      if (answered) answeredCount++;
    }

    if (questionMatches.length > 0) {
      const qScore = Math.round(12 * (answeredCount / questionMatches.length));
      contentScore += qScore;
      if (answeredCount >= questionMatches.length) {
        feedback.push({ type: 'good', message: '全ての質問に答えられています！' });
      } else {
        feedback.push({
          type: 'warning',
          message: `質問${questionMatches.length}つ中${answeredCount}つに答えています。全部の質問に答えよう！`
        });
      }
    }

    scores.content = Math.min(30, contentScore);

  } else {
    // Essay mode
    let contentScore = 0;

    // Check opinion stated
    if (/i\s+think/i.test(text) || /i\s+believe/i.test(text) || /in\s+my\s+opinion/i.test(text) || /i\s+(do\s+not|don'?t)\s+think/i.test(text) || /i\s+agree/i.test(text) || /i\s+disagree/i.test(text)) {
      contentScore += 10;
      feedback.push({ type: 'good', message: '自分の意見がしっかり述べられています！' });
    } else {
      feedback.push({ type: 'warning', message: '"I think ..." や "I believe ..." で自分の意見を述べよう' });
    }

    // Check reasons
    const hasFirst = /\bfirst(ly)?\b/i.test(text);
    const hasSecond = /\bsecond(ly)?\b/i.test(text);
    const hasBecause = /\bbecause\b/i.test(text);
    const hasAlso = /\balso\b/i.test(text);
    const hasMoreover = /\bmoreover\b/i.test(text);
    const hasFurthermore = /\bfurthermore\b/i.test(text);
    const hasReason = /\breason/i.test(text);

    let reasonCount = 0;
    if (hasFirst) reasonCount++;
    if (hasSecond) reasonCount++;
    if (!hasFirst && !hasSecond && hasBecause) reasonCount = 1;
    if (hasAlso || hasMoreover || hasFurthermore) reasonCount = Math.max(reasonCount, 1);

    if (reasonCount >= 2) {
      contentScore += 12;
      feedback.push({ type: 'good', message: '理由が2つ述べられています！ (First, ... Second, ...)' });
    } else if (reasonCount === 1) {
      contentScore += 6;
      feedback.push({ type: 'warning', message: '理由をもう1つ追加しよう。"First, ... Second, ..." の形で書くと良い。' });
    } else {
      feedback.push({ type: 'warning', message: '"First, ..." "Second, ..." を使って理由を2つ書こう' });
    }

    // Check sentence count
    const sentCount = sentences.length;
    if (sentCount >= 3) {
      contentScore += 8;
      feedback.push({ type: 'good', message: `${sentCount}文で構成されています。` });
    } else {
      contentScore += Math.round(8 * (sentCount / 3));
      feedback.push({ type: 'warning', message: `文が${sentCount}文しかありません。3文以上書こう。` });
    }

    scores.content = Math.min(30, contentScore);
  }

  // ===== 5. Grammar Check (20 points) =====
  let grammarErrors = 0;
  let grammarFeedback = [];

  // Subject-verb agreement errors
  const svErrors = [
    { pattern: /\bi\s+is\b/gi, fix: '"I is" → "I am"' },
    { pattern: /\bi\s+was\s+agree/gi, fix: '"I was agree" → "I agreed"' },
    { pattern: /\bshe\s+have\b/gi, fix: '"She have" → "She has"' },
    { pattern: /\bhe\s+have\b/gi, fix: '"He have" → "He has"' },
    { pattern: /\bit\s+have\b/gi, fix: '"It have" → "It has"' },
    { pattern: /\bshe\s+don['']t\b/gi, fix: '"She don\'t" → "She doesn\'t"' },
    { pattern: /\bhe\s+don['']t\b/gi, fix: '"He don\'t" → "He doesn\'t"' },
    { pattern: /\bthey\s+is\b/gi, fix: '"They is" → "They are"' },
    { pattern: /\bwe\s+is\b/gi, fix: '"We is" → "We are"' },
    { pattern: /\byou\s+is\b/gi, fix: '"You is" → "You are"' },
    { pattern: /\bi\s+are\b/gi, fix: '"I are" → "I am"' },
    { pattern: /\bi\s+has\b/gi, fix: '"I has" → "I have"' },
  ];

  for (const rule of svErrors) {
    if (rule.pattern.test(text)) {
      grammarErrors++;
      grammarFeedback.push(rule.fix);
    }
  }

  // Article errors: "a" before vowel sound
  const aVowelErrors = text.match(/\ba\s+[aeiou]\w*/gi);
  if (aVowelErrors) {
    for (const match of aVowelErrors) {
      const word = match.replace(/^a\s+/i, '');
      // Exclude "a unique", "a university", "a useful" etc. (u sounds like "yoo")
      if (!/^(uni|use|user|usual|unique|united|union|uniform|universal|utility|utensil)/i.test(word) &&
          !/^(one|once|European)/i.test(word)) {
        grammarErrors++;
        if (grammarFeedback.length < 5) {
          grammarFeedback.push(`"a ${word}" → "an ${word}"`);
        }
      }
    }
  }

  // Common mistakes
  const commonMistakes = [
    { pattern: /\bi\s+am\s+agree\b/gi, fix: '"I am agree" → "I agree"' },
    { pattern: /\bmore\s+better\b/gi, fix: '"more better" → "better"' },
    { pattern: /\bmore\s+worse\b/gi, fix: '"more worse" → "worse"' },
    { pattern: /\bmore\s+easier\b/gi, fix: '"more easier" → "easier"' },
    { pattern: /\bmore\s+bigger\b/gi, fix: '"more bigger" → "bigger"' },
    { pattern: /\bmore\s+faster\b/gi, fix: '"more faster" → "faster"' },
    { pattern: /\bmost\s+best\b/gi, fix: '"most best" → "best"' },
    { pattern: /\bmost\s+worst\b/gi, fix: '"most worst" → "worst"' },
    { pattern: /\bdoesn['']t\s+\w+s\b/gi, fix: '"doesn\'t + 動詞s" → "doesn\'t + 動詞の原形"（例: doesn\'t likes → doesn\'t like）' },
    { pattern: /\bdon['']t\s+\w+s\b/gi, fix: '"don\'t + 動詞s" → "don\'t + 動詞の原形"（例: don\'t likes → don\'t like）' },
    { pattern: /\bi\s+i\b/gi, fix: '"I I" → 主語が重複しています' },
    { pattern: /\bhe\s+he\b/gi, fix: '"He he" → 主語が重複しています' },
    { pattern: /\bshe\s+she\b/gi, fix: '"She she" → 主語が重複しています' },
    { pattern: /\bthey\s+they\b/gi, fix: '"They they" → 主語が重複しています' },
    { pattern: /\bcan\s+to\b/gi, fix: '"can to ..." → "can ..."（canの後にtoは不要）' },
    { pattern: /\bmust\s+to\b/gi, fix: '"must to ..." → "must ..."（mustの後にtoは不要）' },
    { pattern: /\bshould\s+to\b/gi, fix: '"should to ..." → "should ..."（shouldの後にtoは不要）' },
    { pattern: /\bwill\s+to\b/gi, fix: '"will to ..." → "will ..."（willの後にtoは不要）' },
    { pattern: /\bgo\s+to\s+home\b/gi, fix: '"go to home" → "go home"' },
    { pattern: /\bwent\s+to\s+home\b/gi, fix: '"went to home" → "went home"' },
    { pattern: /\bcome\s+to\s+home\b/gi, fix: '"come to home" → "come home"' },
  ];

  for (const rule of commonMistakes) {
    if (rule.pattern.test(text)) {
      grammarErrors++;
      grammarFeedback.push(rule.fix);
    }
  }

  // Simple spelling check: check words against common word list
  let spellingErrors = [];
  for (const word of words) {
    const cleaned = word.replace(/[^a-zA-Z']/g, '').toLowerCase();
    if (cleaned.length <= 1) continue;
    if (cleaned === '') continue;
    // Skip proper nouns (capitalized words that aren't sentence starters)
    if (word[0] === word[0].toUpperCase() && word[0] !== word[0].toLowerCase()) continue;
    // Skip contractions
    if (cleaned.includes("'")) {
      const parts = cleaned.split("'");
      if (parts.every(p => COMMON_WORDS.has(p) || p.length <= 2)) continue;
    }
    if (!COMMON_WORDS.has(cleaned)) {
      // Be lenient: only flag if it looks like a real attempt at an English word
      if (/^[a-z]+$/.test(cleaned) && cleaned.length > 2) {
        spellingErrors.push(word.replace(/[^a-zA-Z']/g, ''));
      }
    }
  }

  // Limit spelling feedback to avoid overwhelming
  if (spellingErrors.length > 0) {
    const uniqueSpelling = [...new Set(spellingErrors)].slice(0, 5);
    // Don't count too harshly - many valid words won't be in our list
    const spellingPenalty = Math.min(uniqueSpelling.length, 3);
    grammarErrors += spellingPenalty;
    feedback.push({
      type: 'warning',
      message: `スペルを確認しよう`,
      fix: uniqueSpelling.map(w => `"${w}"`).join(', ') + ' ← 辞書にない単語です（固有名詞の場合は問題ありません）'
    });
  }

  if (grammarErrors === 0) {
    scores.grammar = 20;
    feedback.push({ type: 'good', message: '文法的なミスが見つかりませんでした！' });
  } else {
    scores.grammar = Math.max(0, 20 - grammarErrors * 4);
    for (const gf of grammarFeedback.slice(0, 4)) {
      feedback.push({ type: 'error', message: '文法エラー', fix: gf });
    }
  }

  // ===== Calculate total score =====
  const totalScore = Math.min(100, scores.wordCount + scores.capitalization + scores.punctuation + scores.content + scores.grammar);

  // Be generous: add bonus for effort
  const finalScore = Math.min(100, totalScore + (wordCount >= 5 ? 5 : 0));

  return { feedback, score: finalScore, scores };
}

function highlightErrors(text) {
  let highlighted = text;

  // Highlight uncapitalized sentence starts
  highlighted = highlighted.replace(/([.!?]\s+)([a-z])/g, (match, punct, letter) => {
    return punct + '<mark>' + letter + '</mark>';
  });

  // Highlight "i" used as standalone pronoun (lowercase)
  highlighted = highlighted.replace(/(^|\s)(i)(\s|[,.]|$)/g, (match, before, i, after) => {
    return before + '<mark>' + i + '</mark>' + after;
  });

  // Highlight common grammar errors
  const errorPatterns = [
    /\bi\s+is\b/gi,
    /\bi\s+am\s+agree\b/gi,
    /\bmore\s+better\b/gi,
    /\bmore\s+worse\b/gi,
    /\bshe\s+have\b/gi,
    /\bhe\s+have\b/gi,
    /\bi\s+i\b/gi,
    /\bcan\s+to\b/gi,
    /\bmust\s+to\b/gi,
    /\bgo\s+to\s+home\b/gi,
  ];

  for (const pattern of errorPatterns) {
    highlighted = highlighted.replace(pattern, match => `<mark>${match}</mark>`);
  }

  return highlighted;
}

// ===== REVIEW SCREEN =====
function showReview() {
  const key = getQuestionKey();
  const q = QUESTIONS[key][state.currentIndex];
  const answer = document.getElementById('writingInput').value.trim();
  const words = answer ? answer.split(/\s+/).filter(w => w.length > 0).length : 0;
  const target = WORD_TARGETS[state.grade];

  // Run auto grading
  const gradeResult = gradeEssay(answer, q, state.mode);

  // Calculate stars based on auto score
  let stars = 1;
  if (gradeResult.score >= 70) {
    stars = 3;
  } else if (gradeResult.score >= 40) {
    stars = 2;
  }

  // Show stars
  const starsHtml = Array.from({ length: 3 }, (_, i) =>
    `<span style="color:${i < stars ? 'var(--gold)' : 'var(--star-empty)'}; text-shadow: ${i < stars ? '0 2px 8px rgba(255,215,0,0.5)' : 'none'}">&#9733;</span>`
  ).join('');
  document.getElementById('reviewStars').innerHTML = starsHtml;

  const msgs = ['もう少し頑張ろう!', 'いい感じ!', '素晴らしい!'];
  document.getElementById('reviewMsg').textContent = msgs[stars - 1];

  // Show score circle
  const scoreRing = document.getElementById('scoreRing');
  const circumference = 2 * Math.PI * 50; // r=50
  const offset = circumference - (gradeResult.score / 100) * circumference;
  scoreRing.style.strokeDasharray = circumference;
  // Animate after a short delay
  setTimeout(() => {
    scoreRing.style.strokeDashoffset = offset;
    // Color based on score
    if (gradeResult.score >= 70) {
      scoreRing.style.stroke = '#43E97B';
    } else if (gradeResult.score >= 40) {
      scoreRing.style.stroke = '#FFC107';
    } else {
      scoreRing.style.stroke = '#FF6584';
    }
  }, 100);

  document.getElementById('scoreNumber').textContent = gradeResult.score;

  // Render feedback items
  const feedbackList = document.getElementById('feedbackList');
  feedbackList.innerHTML = gradeResult.feedback.map(item => {
    const icon = item.type === 'error' ? '\uD83D\uDD34' : item.type === 'warning' ? '\uD83D\uDFE1' : '\uD83D\uDFE2';
    return `
      <div class="feedback-item ${item.type}">
        <span class="feedback-icon">${icon}</span>
        <div class="feedback-text">
          ${item.message}
          ${item.fix ? `<span class="feedback-fix">${item.fix}</span>` : ''}
        </div>
      </div>
    `;
  }).join('');

  // Your answer (with error highlights)
  document.getElementById('yourAnswer').innerHTML = highlightErrors(answer);
  const rcEl = document.getElementById('reviewWordCount');
  rcEl.textContent = words;
  if (words < target.min) rcEl.className = 'word-count under';
  else if (words > target.max) rcEl.className = 'word-count over';
  else rcEl.className = 'word-count good';

  // Model answer
  const modelText = state.mode === 'email' ? q.modelReply : q.modelAnswer;
  document.getElementById('modelAnswer').textContent = modelText;

  // Self-check
  const checks = state.mode === 'email' ? SELF_CHECKS_EMAIL : SELF_CHECKS_ESSAY;
  const list = document.getElementById('selfCheckList');
  list.innerHTML = checks.map((text, i) =>
    `<li class="self-check-item" data-idx="${i}">
      <div class="check-box"></div>
      <span>${text}</span>
    </li>`
  ).join('');

  list.addEventListener('click', function handler(e) {
    const item = e.target.closest('.self-check-item');
    if (!item) return;
    playSound('click');
    item.classList.toggle('checked');
    if (item.classList.contains('checked')) {
      item.querySelector('.check-box').innerHTML = '&#10003;';
    } else {
      item.querySelector('.check-box').innerHTML = '';
    }
  });

  // Update stats
  state.stats.total++;
  state.stats.stars += stars;
  saveStats();

  playSound('star');
  showScreen('reviewScreen');
}

// Next question
document.getElementById('nextBtn').addEventListener('click', () => {
  playSound('select');
  startPractice();
});

// Home return
document.getElementById('homeReturnBtn').addEventListener('click', () => {
  playSound('click');
  showScreen('homeScreen');
});

loadStats();
